<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" fill="none" role="img" aria-labelledby="title">
<title id="title">Leruitou — Digital Space</title>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#070B17"/><stop offset=".6" stop-color="#11132C"/><stop offset="1" stop-color="#0B2431"/></linearGradient>
