<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I'm Leruitou</title>
  <desc id="desc">A dark cyan banner with a pixel landscape and the motto make progress happen.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/><stop offset="1" stop-color="#123340"/>
    </linearGradient>
    <linearGradient id="accent" x1="72" y1="0" x2="670" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/><stop offset="1" stop-color="#22B8CF"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#67E8F9" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="20" fill="url(#grid)"/>
  <path d="M72 68H104" stroke="#22B8CF" stroke-width="4" stroke-linecap="round"/>
  <text x="118" y="73" fill="#94A3B8" font-family="Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="4">WELCOME TO MY CORNER</text>
  <text x="70" y="163" fill="#F1F5F9" font-family="Segoe UI,Arial,sans-serif" font-size="58" font-weight="700">Hi, I'm <tspan fill="url(#accent)">Leruitou</tspan><tspan fill="#22B8CF">.</tspan></text>
  <text x="74" y="211" fill="#B3C5CE" font-family="Segoe UI,Arial,sans-serif" font-size="22" letter-spacing="2">make progress happen</text>
  <text x="74" y="280" fill="#64828F" font-family="Consolas,monospace" font-size="13" letter-spacing="2">LERUITOU01 / ALWAYS IN PROGRESS</text>
