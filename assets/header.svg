<text x="102" y="104" fill="#93B7CB" font-family="Consolas,monospace" font-size="12" letter-spacing="3">PERSONAL SPACE / 001</text>
<text x="80" y="151" fill="#A78BFA" font-family="Consolas,monospace" font-size="16">Hello, traveler. I'm</text>
<text x="75" y="234" fill="url(#neon)" font-family="Segoe UI,Arial,sans-serif" font-size="84" font-weight="800" letter-spacing="-3">Leruitou<tspan fill="#67E8F9">_</tspan></text>
